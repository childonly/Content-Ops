<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width={{WIDTH}}, initial-scale=1.0">
<title>Cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif; }

  .card-container {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f5;
    padding: 40px;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 60px;
    text-align: center;
  }

  .cover-emoji {
    font-size: 120px;
    margin-bottom: 40px;
    line-height: 1;
  }

  .cover-title {
    font-size: 72px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 24px;
    word-break: break-word;
  }

  .cover-subtitle {
    font-size: 36px;
    font-weight: 400;
    line-height: 1.5;
    opacity: 0.85;
    word-break: break-word;
  }

  {{THEME_CSS}}
</style>
</head>
<body>
  <div class="card-container">
    <div class="card-inner cover-card">
      <div class="cover-emoji">{{EMOJI}}</div>
      <h1 class="cover-title">{{TITLE}}</h1>
      <p class="cover-subtitle">{{SUBTITLE}}</p>
    </div>
  </div>
</body>
</html>
