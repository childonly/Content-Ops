<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width={{WIDTH}}, initial-scale=1.0">
<title>Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: {{WIDTH}}px; min-height: {{HEIGHT}}px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    font-size: 32px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .card-container {
    width: {{WIDTH}}px;
    min-height: {{HEIGHT}}px;
    display: flex;
    align-items: stretch;
    justify-content: center;
    background: #f5f5f5;
    padding: 40px;
    overflow: hidden;
  }

  .card-inner {
    width: 100%;
    border-radius: 24px;
    padding: 60px 50px;
    display: flex;
    flex-direction: column;
  }

  .card-content {
    flex: 1;
    width: 100%;
    word-break: break-word;
    overflow: hidden;
  }

  .card-content h1 {
    font-size: 52px;
    font-weight: 800;
    line-height: 1.3;
    margin-bottom: 24px;
  }

  .card-content h2 {
    font-size: 44px;
    font-weight: 700;
    line-height: 1.3;
    margin: 32px 0 16px 0;
  }

  .card-content h3 {
    font-size: 38px;
    font-weight: 700;
    line-height: 1.4;
    margin: 24px 0 12px 0;
  }

  .card-content p {
    font-size: 32px;
    line-height: 1.75;
    margin-bottom: 16px;
  }

  .card-content ul {
    list-style: none;
    margin: 16px 0;
    padding: 0;
  }

  .card-content li {
    font-size: 32px;
    line-height: 1.75;
    padding-left: 36px;
    position: relative;
    margin-bottom: 10px;
  }

  .card-content li::before {
    content: "•";
    position: absolute;
    left: 8px;
    font-weight: bold;
  }

  .card-content strong {
    font-weight: 700;
  }

  .card-content em {
    font-style: italic;
  }

  /* auto-fit 模式：整体缩放 */
  .mode-auto-fit .card-content {
    transform-origin: top center;
  }

  /* auto-split 模式 */
  .mode-auto-split .card-container {
    overflow: hidden;
  }

  .card-content-wrapper {
    width: 100%;
  }

  {{THEME_CSS}}
</style>
</head>
<body class="{{MODE_CLASS}}">
  <div class="card-container">
    <div class="card-inner">
      <div class="card-content">
        {{CONTENT}}
      </div>
    </div>
  </div>
</body>
</html>
